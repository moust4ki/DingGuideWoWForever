name: Report a problem (made in game by Ding!)
description: Paste the text Ding! wrote for you in game, with the step, your position and your quests.
title: "Ding! report: "
body:
  - type: markdown
    attributes:
      value: |
        In game, open **Report a problem with the guide** in Ding!: the orange flag in the guide window's title bar ("Problem with this step?"), its key (Settings > Keybinds), or `/ding bug`. Pick what went wrong, add a few words if you can, then **Create the text** and copy it with Ctrl+C.
        The text's first line can be the title above. Without a keyboard, Ding! keeps your last 20 reports in `WTF\Account\<account>\SavedVariables\Ding.lua` (written when you log out or reload): you can attach that file instead.
  - type: textarea
    id: report
    attributes:
      label: Paste the text Ding made here
      description: The whole text, from "Ding! report:" to the date. It never holds your character's name, realm or account.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Anything the text does not say (optional).
    validations:
      required: false
